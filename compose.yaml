services:
  budge:
    build: .
    image: budge-fresh:local
    stdin_open: true
    tty: true
    init: true
    restart: "no"
    ports:
      - "127.0.0.1:18780:18780"
      - "127.0.0.1:18781:18781"
    volumes:
      - budge-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  budge-data:
